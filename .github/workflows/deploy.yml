name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Scoped per ref: pushes to other branches create runs that skip the jobs
  # below, and an unscoped group would let them cancel a real deployment.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Only the repository's default branch is published, whatever it is called.
    # Manual runs are allowed from any branch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Enables the repo's Pages site for GitHub Actions deployments (source
      # otherwise defaults to "Deploy from a branch"), which is what the
      # deploy job's actions/deploy-pages step below requires to succeed.
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
